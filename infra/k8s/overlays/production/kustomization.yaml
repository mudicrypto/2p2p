apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: p2p-production
resources:
- ../../base
images:
- name: ghcr.io/example/p2p
  newTag: IMAGE_TAG
patches:
- target:
    kind: ExternalSecret
    name: p2p-secrets
  patch: "- op: replace\n  path: /spec/dataFrom/0/extract/key\n  value: p2p/production/app\n"
