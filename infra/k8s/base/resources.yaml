        labelSelector:
          matchLabels:
            app: p2p-worker
      volumes:
      - name: tmp
        emptyDir: {}
      containers:
      - name: p2p-worker
        image: ghcr.io/example/p2p:IMAGE_TAG
        env:
        - name: APP
          value: worker
        - name: NODE_ENV
          value: production
        envFrom:
        - configMapRef:
            name: p2p-config
        - secretRef:
            name: p2p-secrets
        resources:
          requests:
            cpu: 500m
            memory: 768Mi
          limits:
            memory: 768Mi
        securityContext:
          runAsNonRoot: true
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
