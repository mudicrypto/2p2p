apiVersion: v1
kind: ServiceAccount
metadata:
  name: p2p
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: p2p-config
data:
  PROVIDER_MODE: real
  API_PORT: '4000'
  API_WORKERS: '1'
  TRUST_PROXY: '1'
  WEB_ORIGIN: https://app.example.com
  ADMIN_ORIGIN: https://admin.example.com
  WEBAUTHN_RP_ID: example.com
  WEBAUTHN_ORIGIN: https://app.example.com
  API_URL: http://p2p-api
  NEXT_PUBLIC_WS_URL: https://api.example.com
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: p2p-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: p2p-secrets
  dataFrom:
  - extract:
      key: p2p/ENV/app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: p2p-api
  labels:
    app: p2p-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: p2p-api
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: p2p-api
    spec:
      serviceAccountName: p2p
      automountServiceAccountToken: false
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: p2p-api
      volumes:
      - name: tmp
        emptyDir: {}
      containers:
      - name: p2p-api
        image: ghcr.io/example/p2p:IMAGE_TAG
        env:
        - name: APP
          value: api
        - name: NODE_ENV
          value: production
        envFrom:
        - configMapRef:
            name: p2p-config
        - secretRef:
            name: p2p-secrets
        resources:
          requests:
            cpu: '1'
            memory: 1Gi
          limits:
            memory: 1Gi
        securityContext:
          runAsNonRoot: true
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 4000
        readinessProbe:
          httpGet:
            path: /healthz
            port: 4000
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 4000
          periodSeconds: 15
          failureThreshold: 4
        volumeMounts:
        - name: tmp
          mountPath: /tmp
---
apiVersion: v1
kind: Service
metadata:
  name: p2p-api
spec:
  selector:
    app: p2p-api
  ports:
  - port: 80
    targetPort: 4000
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: p2p-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: p2p-api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: p2p-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: p2p-api
  minReplicas: 3
  maxReplicas: 30
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 65
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: p2p-worker
  labels:
    app: p2p-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: p2p-worker
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: p2p-worker
    spec:
      serviceAccountName: p2p
      automountServiceAccountToken: false
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
