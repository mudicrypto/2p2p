  selector:
    matchLabels:
      app: p2p-admin
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: p2p-admin
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: p2p-admin
  minReplicas: 2
  maxReplicas: 30
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 65
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: p2p-admin-allowlist
data:
  cidrs: 203.0.113.0/24
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: p2p-public
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/wafv2-acl-arn: WAF_ARN
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
spec:
  ingressClassName: alb
  rules:
  - host: app.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: p2p-web
            port:
              number: 80
  - host: api.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: p2p-api
            port:
              number: 80
  - host: tg.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: p2p-tg
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: p2p-admin
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/inbound-cidrs: 203.0.113.0/24
    alb.ingress.kubernetes.io/group.name: admin
spec:
  ingressClassName: alb
  rules:
  - host: admin.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: p2p-admin
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-http
spec:
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values:
      - p2p-api
      - p2p-web
      - p2p-tg
      - p2p-admin
  ingress:
  - {}
  policyTypes:
  - Ingress
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: p2p-backup
spec:
  schedule: 17 2 * * *
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: p2p-backup
          restartPolicy: Never
          containers:
          - name: p2p-backup
            image: ghcr.io/example/p2p-ops:IMAGE_TAG
            command:
            - bash
            - -c
            - BACKUP_DIR=/tmp infra/backup/backup.sh
            envFrom:
            - secretRef:
                name: p2p-backup
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: p2p-restore-test
spec:
  schedule: 43 4 * * 0
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: p2p-backup
          restartPolicy: Never
          containers:
          - name: p2p-restore-test
            image: ghcr.io/example/p2p-ops:IMAGE_TAG
            command:
            - bash
            - -c
            - DUMP=$(BACKUP_DIR=/tmp infra/backup/backup.sh) && DUMP=$DUMP infra/backup/restore-test.sh
            envFrom:
            - secretRef:
                name: p2p-backup
---
apiVersion: batch/v1
kind: Job
metadata:
  name: p2p-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: migrate
        image: ghcr.io/example/p2p:IMAGE_TAG
        command:
        - node
        - packages/db/dist/migrate.js
        envFrom:
        - secretRef:
            name: p2p-secrets
