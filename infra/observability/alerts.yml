groups:
  - name: money
    rules:
      - alert: LedgerInvariantFailed
        expr: min(ledger_invariant_ok) == 0
        for: 0m
        labels: { severity: page }
        annotations: { summary: "Ledger invariant failed — withdrawals auto-paused", runbook: "docs/runbooks/invariant-failure.md" }
      - alert: WithdrawalsPaused
        expr: max(withdrawals_paused) == 1
        for: 5m
        labels: { severity: page }
        annotations: { summary: "Withdrawals paused for 5m", runbook: "docs/runbooks/invariant-failure.md" }
  - name: api
    rules:
      - alert: OrderLatencyP95High
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{route="/v1/orders",method="POST"}[5m]))) > 0.3
        for: 10m
        labels: { severity: ticket }
        annotations: { summary: "p95 order creation latency above 300ms" }
      - alert: Api5xxRate
        expr: sum(rate(http_request_duration_seconds_count{status=~"5.."}[5m])) / sum(rate(http_request_duration_seconds_count[5m])) > 0.01
        for: 5m
        labels: { severity: page }
        annotations: { summary: "API 5xx above 1%", runbook: "docs/runbooks/api-errors.md" }
      - alert: NoOrdersCreated
        expr: sum(increase(domain_events_total{type="order.created"}[30m])) == 0
        for: 30m
        labels: { severity: ticket }
        annotations: { summary: "No orders created in 30 minutes" }
  - name: infra
    rules:
      - alert: PostgresReplicaLag
        expr: pg_replication_lag_seconds > 30
        for: 5m
        labels: { severity: ticket }
      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels: { severity: page }
