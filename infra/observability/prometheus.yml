global: { scrape_interval: 15s, evaluation_interval: 15s }
rule_files: [alerts.yml]
alerting: { alertmanagers: [{ static_configs: [{ targets: ['alertmanager:9093'] }] }] }
scrape_configs:
  - job_name: api
    authorization: { credentials_file: /etc/prometheus/metrics_token }
    kubernetes_sd_configs: [{ role: pod }]
    relabel_configs:
      - { source_labels: [__meta_kubernetes_pod_label_app], regex: p2p-api, action: keep }
      - { source_labels: [__meta_kubernetes_pod_label_region], target_label: region }
    metrics_path: /metrics
  - job_name: postgres
    static_configs: [{ targets: ['postgres-exporter:9187'] }]
  - job_name: redis
    static_configs: [{ targets: ['redis-exporter:9121'] }]
