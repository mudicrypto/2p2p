services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: p2p }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "postgres"], interval: 5s }
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  migrate:
    build: { context: ., args: { APP: api } }
    command: ["node", "/repo/packages/db/dist/migrate.js"]
    env_file: .env
    depends_on: { postgres: { condition: service_healthy } }
  api:
    build: { context: ., args: { APP: api } }
    env_file: .env
    environment: { DATABASE_URL: postgres://postgres:postgres@postgres:5432/p2p, REDIS_URL: redis://redis:6379 }
    ports: ["4000:4000"]
    depends_on: [migrate, redis]
  worker:
    build: { context: ., args: { APP: worker } }
    env_file: .env
    environment: { DATABASE_URL: postgres://postgres:postgres@postgres:5432/p2p, REDIS_URL: redis://redis:6379 }
    depends_on: [migrate, redis]
  web:
    build: { context: ., args: { APP: web } }
    environment: { NEXT_PUBLIC_API_URL: http://localhost:4000 }
    ports: ["3000:3000"]
  admin:
    build: { context: ., args: { APP: admin } }
    environment: { NEXT_PUBLIC_API_URL: http://localhost:4000 }
    ports: ["3001:3000"]
volumes: { pgdata: {} }
